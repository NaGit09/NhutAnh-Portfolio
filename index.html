System follows distributed Microservices architecture patterns separated by Domain-Driven Design (DDD).

TRANSACTION STREAM FLOW:
1. Client (Next.js 15) submits a checkout event through the gateway.
2. Kong API Gateway parses and filters the incoming request payload.
3. Auth Service verifies the Asymmetric Key RS256 signature and checks Redis to verify if the token is blacklisted.

                          <div className="text-[8px] text-slate-500 mt-0.5">RS256 JWT Subsystems</div>
                          <div className="flex justify-around text-[7px] text-slate-500 mt-1 border-t border-slate-800/80 pt-1 font-sans">
                            <span>CPU: {simMetrics.auth.cpu}</span>
                            <span>RAM: {simMetrics.auth.mem}</span>
                          </div>
                        </div>

                        <div className={`px-3 py-2 rounded-xl border text-[10px] sm:text-xs font-mono max-w-[170px] text-center transition-all duration-300 ${simStep === 'order' ? 'bg-cyan-950 border-cyan-400 text-cyan-200 shadow-lg scale-105' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                          <div className="font-bold">📝 Order Service</div>
                          <div className="text-[8px] text-slate-500 mt-0.5">MySQL Persistent Layer</div>
                          <div className="flex justify-around text-[7px] text-slate-500 mt-1 border-t border-slate-800/80 pt-1 font-sans">
                            <span>CPU: {simMetrics.order.cpu}</span>
                            <span>RAM: {simMetrics.order.mem}</span>
                          </div>
                        </div>
                      </div>

                      {/* 4. Asynchronous Pipeline Message Broker */}
                      <div className={`z-10 px-5 py-1.5 rounded-lg border text-[10px] sm:text-xs font-mono transition-all duration-300 ${simStep === 'kafka' ? 'bg-emerald-950 border-emerald-400 text-emerald-200 shadow-lg scale-105' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                        <span className="font-bold">📡 Apache Kafka Multi-Broker</span>
                        <span className="block text-[8px] text-slate-500 text-center font-sans">Active Topics: 3 | Transmitted: {simMetrics.kafka.msgs}</span>
                      </div>

                      {/* 5. Inventory Storage Sub-tier */}
                      <div className="w-full flex justify-start px-2 sm:px-6 z-10">
                        <div className={`px-3 py-2 rounded-xl border text-[10px] sm:text-xs font-mono max-w-[180px] text-center transition-all duration-300 ${simStep === 'inventory' ? 'bg-emerald-950 border-emerald-400 text-emerald-200 shadow-lg scale-105' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                          <div className="font-bold">📦 Inventory Service</div>
                          <div className="text-[8px] text-slate-500 mt-0.5">Distributed Locks Module</div>
                          <div className="flex justify-around text-[7px] text-slate-500 mt-1 border-t border-slate-800/80 pt-1 font-sans">
                            <span>CPU: {simMetrics.inventory.cpu}</span>
                            <span>RAM: {simMetrics.inventory.mem}</span>
                          </div>
                        </div>
                      </div>

                    </div>
                  </div>

                  {/* Simulator Terminal Output Stream */}
                  <div className="bg-slate-950 border border-slate-900 rounded-xl p-3.5 font-mono text-[9px] sm:text-[10px] h-32 overflow-y-auto space-y-1.5">
                    <div className="text-slate-500">// Distributed Runtime Console Outputs</div>
                    {simLog.length === 0 && (
                      <div className="text-slate-600 italic">Ecosystem waiting in STANDBY mode. Engage simulation button to intercept live transactions...</div>
                    )}
                    {simLog.map((log, index) => {
                      let tagColor = 'text-cyan-400';
                      if (log.type === 'system') tagColor = 'text-yellow-400';
                      if (log.type === 'auth') tagColor = 'text-sky-400';
                      if (log.type === 'kafka') tagColor = 'text-indigo-400';
                      if (log.type === 'redis') tagColor = 'text-red-400';
                      if (log.type === 'success') tagColor = 'text-emerald-400';
                      return (
                        <div key={index} className="flex space-x-2 leading-relaxed">
                          <span className="text-slate-600">[{log.timestamp}]</span>
                          <span className={`${tagColor} font-bold`}>[{log.tag}]</span>
                          <span className="text-slate-300">{log.msg}</span>
                        </div>
                      );
                    })}
                  </div>

                </div>

              </div>
            </section>

            {/* INTEGRATED IDE INTERACTIVE TERMINAL EMULATOR */}

                  <div className="flex items-center space-x-1.5">
                    <span className="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
                    <span className="text-[10px] text-slate-500 font-bold ml-2">nhut-anh-workspace - VS Code Server</span>
                  </div>
                  <span className="text-[10px] text-slate-500">nhut-anh@nlu-ubuntu-2026</span>
                </div>

                <div className="flex-1 flex flex-col sm:flex-row items-stretch">
                  
                  <div className="w-full sm:w-48 bg-[#0b132b]/80 border-r border-slate-900 p-3 select-none flex flex-col justify-between">

                      <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest pb-2 flex items-center justify-between border-b border-slate-900/60 mb-2">
                        <span>WORKSPACE</span>
                        <span>📁</span>
                      </div>
                      <div className="space-y-1">
                        <div className="flex items-center text-[11px] text-slate-300 font-bold">
                          <Icons.Folder />
                          <span>cv-portfolio</span>
                        </div>
                        <div className="pl-4 space-y-0.5">
                          {Object.keys(FILE_CONTENTS).map((filename) => (
                            <button
                              key={filename}
                              onClick={() => handleFileClick(filename)}
                              className={`w-full text-left py-1 px-1.5 rounded flex items-center text-[10.5px] transition-colors ${activeFile === filename ? 'bg-slate-900/90 text-cyan-400 font-bold' : 'text-slate-400 hover:bg-slate-900/40 hover:text-slate-200'}`}
                            >
                              <Icons.File />
                              <span>{filename}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                    <div className="pt-4 border-t border-slate-900/60 hidden sm:block">
                      <div className="text-[9px] text-slate-500">UMD React v18 Active</div>
                      <div className="text-[9px] text-slate-500">Babel Runtime Engine</div>
                    </div>
                  </div>

                  <div className="flex-1 bg-[#050811] flex flex-col min-h-[220px]">
                    
                    <div className="bg-[#0b132b]/40 flex border-b border-slate-900/80 overflow-x-auto select-none">
                      {openFiles.map((filename) => (
                        <div
                          key={filename}
                          onClick={() => setActiveFile(filename)}
                          className={`cursor-pointer px-3 py-2 text-[10px] font-mono border-r border-slate-900/80 flex items-center ${activeFile === filename ? 'bg-[#050811] text-cyan-400 border-t-2 border-t-cyan-500 font-bold' : 'text-slate-500 bg-[#0f172a]/20 hover:text-slate-300'}`}
                        >
                          <span className="mr-1.5">📄</span>
                          <span>{filename}</span>
                          <button
                            onClick={(e) => handleCloseFile(e, filename)}
                            className="ml-2 hover:text-red-400 font-sans font-bold text-[8px]"
                          >
                            ×
                          </button>
                        </div>
                      ))}
                    </div>

                    <div className="flex-1 p-4 font-mono text-[10.5px] overflow-y-auto leading-relaxed select-text min-h-[160px]">
                      {activeFile && FILE_CONTENTS[activeFile] ? (
                        <table className="w-full border-collapse">
                          <tbody>
                            {FILE_CONTENTS[activeFile].split('\n').map((line, idx) => (
                              <tr key={idx} className="hover:bg-slate-900/20">
                                <td className="w-6 text-slate-600 text-right select-none pr-3 text-[9px]">{idx + 1}</td>
                                <td className="text-slate-300 whitespace-pre-wrap">{line}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      ) : (
                        <div className="text-slate-600 italic flex items-center justify-center h-full">Select a workspace configuration layer to display variables...</div>
                      )}
                    </div>

                  </div>

                </div>

                <div className="bg-[#03060c] border-t border-slate-900 p-3.5 flex flex-col h-48 justify-between select-text">
                  
                  <div className="flex-1 overflow-y-auto space-y-1.5 mb-2">
                    {terminalHistory.map((item, idx) => (
                      <div key={idx} className="text-[11px]">
                        {item.type === 'input' ? (
                          <div className="flex items-center text-emerald-400">
                            <span className="text-slate-500 mr-2">anh-tn@nlu:~$</span>
                            <span className="font-bold">{item.text}</span>
                          </div>
                        ) : (
                          <pre className="text-slate-400 whitespace-pre-wrap leading-relaxed mt-0.5 font-mono">{item.text}</pre>
                        )}
                      </div>
                    ))}
                    <div ref={terminalBottomRef} />
                  </div>

                  <div className="flex flex-wrap items-center gap-1.5 pb-2 border-t border-slate-900/60 pt-2 select-none">
                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mr-1">Hot Shortcuts:</span>
                    {['help', 'about', 'skills', 'projects', 'contact'].map((chip) => (
                      <button
                        key={chip}
                        onClick={() => executeTerminalCommand(chip)}
                        className="px-2 py-0.5 rounded bg-slate-900 text-slate-400 hover:text-cyan-400 border border-slate-800 text-[10px] font-mono transition-colors"

                        {chip}
                      </button>

                  </div>

                  <form onSubmit={handleTerminalSubmit} className="flex items-center bg-[#070b13] border border-slate-900 rounded-lg px-3 py-1.5">

                    <input
                      type="text"

                      onChange={(e) => setTerminalInput(e.target.value)}

              </div>
            </section>

            {/* CONTACT SECTOR */}

                  Connect <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">Channels</span>

                <p className="text-slate-400 leading-relaxed text-sm">

                <div className="space-y-3">
                  <a href="tel:0387822490" className="flex items-center space-x-3 p-4 rounded-xl border border-slate-900 text-slate-300 hover:text-cyan-400 bg-slate-900/30 hover:border-cyan-500/20 transition-all">
                    <div className="p-2.5 bg-cyan-950 text-cyan-400 rounded-lg">

                    <div>

                      <div className="font-bold text-sm">0387822490</div>
                    </div>
                  </a>

                  <a href="mailto:nhutanhtran806@gmail.com" className="flex items-center space-x-3 p-4 rounded-xl border border-slate-900 text-slate-300 hover:text-cyan-400 bg-slate-900/30 hover:border-cyan-500/20 transition-all">
                    <div className="p-2.5 bg-cyan-950 text-cyan-400 rounded-lg">
                      <Icons.Mail />
                    </div>
                    <div>
                      <div className="text-[9px] font-mono text-slate-500 uppercase font-bold tracking-widest">Direct Mailbox</div>
                      <div className="font-bold text-sm">nhutanhtran806@gmail.com</div>
                    </div>
                  </a>

                  <div className="flex items-center space-x-3 p-4 rounded-xl border border-slate-900 text-slate-300 bg-slate-900/30">
                    <div className="p-2.5 bg-emerald-950 text-emerald-400 rounded-lg">
                      <Icons.MapPin />
                    </div>
                    <div>
                      <div className="text-[9px] font-mono text-slate-500 uppercase font-bold tracking-widest">Base Location</div>

                    </div>
                  </div>
                </div>

              <div className="lg:col-span-7 rounded-2xl border border-slate-900 bg-slate-900/20 p-6 backdrop-blur-sm relative overflow-hidden">
                {formSubmitted ? (
                  <div className="flex flex-col items-center justify-center py-10 text-center space-y-4">
                    <div className="w-14 h-14 bg-emerald-950 text-emerald-400 rounded-full flex items-center justify-center border border-emerald-500/30">
                      <Icons.Check />
                    </div>
                    <h3 className="text-lg font-black text-slate-100">Message Dispatched!</h3>
                    <p className="text-slate-400 text-xs max-w-sm leading-relaxed">
                      Thank you for contacting me. I will review the payload details and reach back to your return address coordinates shortly.

                  </div>
                ) : (
                  <form onSubmit={handleFormSubmit} className="space-y-4">
                    <h3 className="text-base font-bold text-slate-200 uppercase tracking-wider font-mono">Instant Messaging Gateway</h3>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="space-y-1">
                        <label className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Your Identity / Company</label>
                        <input
                          type="text"
                          name="name"
                          value={formData.name}
                          onChange={handleInputChange}
                          required
                          placeholder="John Doe"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                        />

                      <div className="space-y-1">
                        <label className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Return Address Email</label>
                        <input
                          type="email"
                          name="email"
                          value={formData.email}
                          onChange={handleInputChange}
                          required
                          placeholder="talent@company.com"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Message Payload Description</label>
                      <textarea
                        name="message"
                        value={formData.message}
                        onChange={handleInputChange}
                        required
                        rows="4"
                        placeholder="Hi Tran Nhut Anh, we reviewed your architecture portfolio models..."
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center justify-center bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-black"
                    >
                      <Icons.Send />
                      Dispatch Message Payload
                    </button>
                  </form>
                )}
              </div>
            </section>

          </main>

          <footer className="bg-slate-950 border-t border-slate-900/60 py-8 text-center">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-2">
              <p className="text-[11px] text-slate-500">
                &copy; 2026 Tran Nhut Anh. Engineered uniquely to support automated corporate recruitment validation protocols.
              </p>
              <p className="text-[9px] text-slate-600 font-mono">
                Powered by React 18 & Tailwind CSS. Clean structures compiled flawlessly for Backend architectures.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
