Dự án sử dụng mô hình Microservices phân tách theo Domain-Driven Design (DDD).

TỔNG QUAN LUỒNG ĐI DỮ LIỆU:

                          <div className="flex justify-around text-[7px] text-slate-500 mt-1 border-t border-slate-800/80 pt-1 font-sans">
                            <span>CPU: {simMetrics.inventory.cpu}</span>
                            <span>MEM: {simMetrics.inventory.mem}</span>
                          </div>
                        </div>
                      </div>

                    </div>
                  </div>

                  {/* Console logs output */}
                  <div className="bg-slate-950 border border-slate-900 rounded-xl p-3.5 font-mono text-[9px] sm:text-[10px] h-32 overflow-y-auto space-y-1.5">
                    <div className="text-slate-500">// Nhật ký theo dõi phân tán thời gian thực (Console logs)</div>
                    {simLog.length === 0 && (
                      <div className="text-slate-600 italic">Hệ thống đang hoạt động ở chế độ chờ (Standby). Bấm nút kích hoạt giả lập để kiểm thử...</div>
                    )}
                    {simLog.map((log, index) => {
                      let tagColor = 'text-cyan-400';
                      if (log.type === 'system') tagColor = 'text-yellow-400';
                      if (log.type === 'auth') tagColor = 'text-sky-400';
                      if (log.type === 'kafka') tagColor = 'text-indigo-400';
                      if (log.type === 'redis') tagColor = 'text-red-400';
                      if (log.type === 'success') tagColor = 'text-emerald-400';
                      return (
                        <div key={index} className="flex space-x-2 leading-relaxed animate-fadeIn">
                          <span className="text-slate-600">[{log.timestamp}]</span>
                          <span className={`${tagColor} font-bold`}>[{log.tag}]</span>
                          <span className="text-slate-300">{log.msg}</span>
                        </div>
                      );
                    })}
                  </div>

                </div>

              </div>
            </section>

            {/* INTEGRATED IDE & SHELL TERMINAL EMULATOR */}
            <section id="terminal" className="scroll-mt-24 space-y-6">
              <div className="text-center max-w-2xl mx-auto space-y-2">
                <h2 className="text-2xl sm:text-3xl font-black tracking-tight">
                  VS Code <span className={`text-transparent bg-clip-text bg-gradient-to-r ${themeGradientText}`}>IDE Terminal</span>
                </h2>
                <p className="text-slate-400 text-xs sm:text-sm">
                  Dành riêng cho nhà tuyển dụng chuyên kỹ thuật. Click duyệt file ở Sidebar hoặc gõ lệnh trực tiếp để tương tác.
                </p>
              </div>

              {/* VS Code Window Container */}
              <div className="max-w-4xl mx-auto bg-[#080d16] border border-slate-800 rounded-xl shadow-2xl overflow-hidden font-mono flex flex-col min-h-[460px]">
                
                {/* 1. Editor Header */}
                <div className="bg-[#0f172a] px-4 py-3 flex items-center justify-between border-b border-slate-900 select-none">
                  <div className="flex items-center space-x-1.5">
                    <span className="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
                    <span className="text-[10px] text-slate-500 font-bold ml-2">nhut-anh-ide - VS Code Server</span>
                  </div>
                  <span className="text-[10px] text-slate-500">nhut-anh@nlu-ubuntu-2026</span>
                </div>

                {/* 2. Main Workspace Body */}
                <div className="flex-1 flex flex-col sm:flex-row items-stretch">
                  
                  {/* Left Sidebar Explorer */}
                  <div className="w-full sm:w-48 bg-[#0b132b]/80 border-r border-slate-900 p-3 select-none flex flex-col justify-between">
                    <div>
                      <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest pb-2 flex items-center justify-between border-b border-slate-900/60 mb-2">
                        <span>WORKSPACE Explorer</span>
                        <span>📁</span>
                      </div>
                      <div className="space-y-1">
                        <div className="flex items-center text-[11px] text-slate-300 font-bold">
                          <Icons.Folder />
                          <span>cv-portfolio</span>
                        </div>
                        {/* Files list */}
                        <div className="pl-4 space-y-0.5">
                          {Object.keys(FILE_CONTENTS).map((filename) => (
                            <button
                              key={filename}
                              onClick={() => handleFileClick(filename)}
                              className={`w-full text-left py-1 px-1.5 rounded flex items-center text-[10.5px] transition-colors ${activeFile === filename ? 'bg-slate-900/90 text-cyan-400 font-bold' : 'text-slate-400 hover:bg-slate-900/40 hover:text-slate-200'}`}
                            >
                              <Icons.File />
                              <span>{filename}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                    <div className="pt-4 border-t border-slate-900/60 hidden sm:block">
                      <div className="text-[9px] text-slate-500">Language: UMD React 18</div>
                      <div className="text-[9px] text-slate-500">Transpiler: Babel STANDALONE</div>
                    </div>
                  </div>

                  {/* Central Text Editor Area */}
                  <div className="flex-1 bg-[#050811] flex flex-col min-h-[220px]">
                    
                    {/* Top file tabs */}
                    <div className="bg-[#0b132b]/40 flex border-b border-slate-900/80 overflow-x-auto select-none">
                      {openFiles.map((filename) => (
                        <div
                          key={filename}
                          onClick={() => setActiveFile(filename)}
                          className={`cursor-pointer px-3 py-2 text-[10px] font-mono border-r border-slate-900/80 flex items-center ${activeFile === filename ? 'bg-[#050811] text-cyan-400 border-t-2 border-t-cyan-500 font-bold' : 'text-slate-500 bg-[#0f172a]/20 hover:text-slate-300'}`}
                        >
                          <span className="mr-1.5">📄</span>
                          <span>{filename}</span>
                          <button
                            onClick={(e) => handleCloseFile(e, filename)}
                            className="ml-2 hover:text-red-400 font-sans font-bold text-[8px]"
                          >
                            ×
                          </button>
                        </div>
                      ))}
                    </div>

                    {/* File contents container */}
                    <div className="flex-1 p-4 font-mono text-[10.5px] overflow-y-auto leading-relaxed select-text min-h-[160px]">
                      {activeFile && FILE_CONTENTS[activeFile] ? (
                        <table className="w-full border-collapse">
                          <tbody>
                            {FILE_CONTENTS[activeFile].split('\n').map((line, idx) => (
                              <tr key={idx} className="hover:bg-slate-900/20">
                                <td className="w-6 text-slate-600 text-right select-none pr-3 text-[9px]">{idx + 1}</td>
                                <td className="text-slate-300 whitespace-pre-wrap">{line}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      ) : (
                        <div className="text-slate-600 italic flex items-center justify-center h-full">Hãy chọn một file từ Explorer để mở...</div>
                      )}
                    </div>

                  </div>

                </div>

                {/* 3. Bottom Shell Terminal Console */}
                <div className="bg-[#03060c] border-t border-slate-900 p-3.5 flex flex-col h-48 justify-between select-text">
                  
                  {/* Console Command output history */}
                  <div className="flex-1 overflow-y-auto space-y-1.5 mb-2 terminal-scroll">
                    {terminalHistory.map((item, idx) => (
                      <div key={idx} className="text-[11px]">
                        {item.type === 'input' ? (
                          <div className="flex items-center text-emerald-400">
                            <span className="text-slate-500 mr-2">anh-tn@nlu:~$</span>
                            <span className="font-bold">{item.text}</span>
                          </div>
                        ) : (
                          <pre className="text-slate-400 whitespace-pre-wrap leading-relaxed mt-0.5 font-mono select-text">{item.text}</pre>
                        )}
                      </div>
                    ))}
                    <div ref={terminalBottomRef} />
                  </div>

                  {/* Quick-action autocomplete chips */}
                  <div className="flex flex-wrap items-center gap-1.5 pb-2 border-t border-slate-900/60 pt-2 select-none">
                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mr-1">Quick Run:</span>
                    {['help', 'about', 'skills', 'projects', 'contact'].map((chip) => (
                      <button
                        key={chip}
                        onClick={() => executeTerminalCommand(chip)}
                        className="px-2 py-0.5 rounded bg-slate-900 text-slate-400 hover:text-cyan-400 border border-slate-800 text-[10px] font-mono transition-colors"
                      >
                        {chip}
                      </button>
                    ))}
                  </div>

                  {/* Terminal input form */}
                  <form onSubmit={handleTerminalSubmit} className="flex items-center bg-[#070b13] border border-slate-900 rounded-lg px-3 py-1.5">
                    <span className="text-slate-500 mr-2 text-xs font-bold select-none">anh-tn@nlu:~$</span>
                    <input
                      type="text"
                      value={terminalInput}
                      onChange={(e) => setTerminalInput(e.target.value)}
                      placeholder="Gõ các lệnh: 'help', 'about', 'skills', 'cat skills.json', 'projects'..."
                      className="flex-1 bg-transparent border-none outline-none text-cyan-400 text-xs font-mono p-0 focus:ring-0 focus:outline-none"
                    />
                    <button type="submit" className="text-[10px] text-cyan-400 hover:text-cyan-300 font-black ml-2 uppercase select-none tracking-wider">
                      RUN
                    </button>
                  </form>

                </div>

              </div>
            </section>

            {/* CONTACT & GET IN TOUCH */}
            <section id="contact" className="scroll-mt-24 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Left Column: Direct channels */}
              <div className="lg:col-span-5 space-y-6">
                <h2 className="text-2xl sm:text-3xl font-black tracking-tight">
                  Kết Nối <span className={`text-transparent bg-clip-text bg-gradient-to-r ${themeGradientText}`}>Với Tôi</span>
                </h2>
                <p className="text-slate-400 leading-relaxed text-sm">
                  Tôi luôn đón chào các cơ hội thực tập Software Engineer, thảo luận dự án backend hoặc đơn giản là chia sẻ niềm đam mê lập trình hệ thống. 
                  Hãy gửi thông tin phản hồi cho tôi ngay!
                </p>

                <div className="space-y-3">
                  <a href="tel:0387822490" className={`flex items-center space-x-3 p-4 rounded-xl border transition-all text-slate-300 hover:text-cyan-400 ${themePanelBg} hover:border-cyan-500/20`}>
                    <div className="p-2.5 bg-cyan-950 text-cyan-400 rounded-lg">
                      <Icons.Phone />
                    </div>
                    <div>
                      <div className="text-[9px] font-mono text-slate-500 uppercase font-bold tracking-widest">Điện thoại di động</div>
                      <div className="font-bold text-sm">0387822490</div>
                    </div>
                  </a>

                  <a href="mailto:nhutanhtran806@gmail.com" className={`flex items-center space-x-3 p-4 rounded-xl border transition-all text-slate-300 hover:text-cyan-400 ${themePanelBg} hover:border-cyan-500/20`}>
                    <div className="p-2.5 bg-cyan-950 text-cyan-400 rounded-lg">
                      <Icons.Mail />
                    </div>
                    <div>
                      <div className="text-[9px] font-mono text-slate-500 uppercase font-bold tracking-widest">Email liên lạc</div>
                      <div className="font-bold text-sm">nhutanhtran806@gmail.com</div>
                    </div>
                  </a>

                  <div className={`flex items-center space-x-3 p-4 rounded-xl border text-slate-300 ${themePanelBg}`}>
                    <div className="p-2.5 bg-emerald-950 text-emerald-400 rounded-lg">
                      <Icons.MapPin />
                    </div>
                    <div>
                      <div className="text-[9px] font-mono text-slate-500 uppercase font-bold tracking-widest">Khu vực sinh sống</div>
                      <div className="font-bold text-sm">Thủ Đức, TP. Hồ Chí Minh</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Right Column: Dynamic submission form */}
              <div className={`lg:col-span-7 rounded-2xl border p-6 backdrop-blur-sm relative overflow-hidden ${isOcean ? 'bg-slate-900/20 border-slate-900' : 'bg-synth-900/20 border-synth-900'}`}>
                {formSubmitted ? (
                  <div className="flex flex-col items-center justify-center py-10 text-center space-y-4 animate-fadeIn">
                    <div className="w-14 h-14 bg-emerald-950 text-emerald-400 rounded-full flex items-center justify-center border border-emerald-500/30 animate-bounce">
                      <Icons.Check />
                    </div>
                    <h3 className="text-lg font-black text-slate-100">Gửi Phản Hồi Thành Công!</h3>
                    <p className="text-slate-400 text-xs max-w-sm leading-relaxed">
                      Cảm ơn quý nhà tuyển dụng đã gửi lời nhắn. Tôi sẽ trực tiếp liên lạc phản hồi qua địa chỉ Email trong thời gian sớm nhất!
                    </p>
                  </div>
                ) : (
                  <form onSubmit={handleFormSubmit} className="space-y-4">
                    <h3 className="text-base font-bold text-slate-200 uppercase tracking-wider font-mono">Gửi lời nhắn nhanh</h3>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="space-y-1">
                        <label className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Tên / Quý công ty</label>
                        <input
                          type="text"
                          name="name"
                          value={formData.name}
                          onChange={handleInputChange}
                          required
                          placeholder="Nguyễn Văn A"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Email liên hệ</label>
                        <input
                          type="email"
                          name="email"
                          value={formData.email}
                          onChange={handleInputChange}
                          required
                          placeholder="hr@company.com"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-400 font-mono uppercase tracking-widest">Lời nhắn nội dung</label>
                      <textarea
                        name="message"
                        value={formData.message}
                        onChange={handleInputChange}
                        required
                        rows="4"
                        placeholder="Xin chào Trần Nhựt Anh, chúng tôi đã xem hồ sơ năng lực của bạn..."
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg py-2 px-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className={`w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center justify-center active:scale-95 ${themeBtn}`}
                    >
                      <Icons.Send />
                      Gửi Lời Nhắn Ngay
                    </button>
                  </form>
                )}
              </div>
            </section>

          </main>

          {/* Footer bar */}
          <footer className="bg-slate-950 border-t border-slate-900/60 py-8 relative z-10 text-center">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-2">
              <p className="text-[11px] text-slate-500">
                &copy; 2026 Trần Nhựt Anh. Thiết kế hồ sơ độc quyền hỗ trợ quy trình tuyển dụng nhân sự.
              </p>
              <p className="text-[9px] text-slate-600 font-mono">
                Kiến tạo bằng React 18, Tailwind CSS v3 &amp; Sự tối ưu tuyệt đối cho Backend &amp; Distributed Architectures.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
